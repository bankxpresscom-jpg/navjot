<!-- Login -->
<section class="login" id="login" hidden>
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="dust" aria-hidden="true"></div>
  <form class="login-card" id="loginForm" novalidate>
    <img class="login-logo" src="https://res.cloudinary.com/dhn6pvsr1/image/upload/f_auto,q_auto,c_limit,w_240/v1790515212/splash-favicon-logo_yxkwes.png" alt="" width="84" height="84">
    <p class="kicker">THE STUDIO</p>
    <h1>Welcome <em>back.</em></h1>
    <p class="login-sub">Sign in to shape every word, photo and link on your website.</p>
    <label class="fl"><input id="lUser" name="user" type="text" autocomplete="username" required placeholder=" "><span>Admin ID</span></label>
    <label class="fl"><input id="lPass" name="pass" type="password" autocomplete="current-password" required placeholder=" "><span>Password</span><button type="button" class="peek" id="peek" aria-label="Show password"><svg class="i"><use href="#i-eye"/></svg></button></label>
    <p class="login-err" id="loginErr" role="alert"></p>
    <button class="gold-btn wide" type="submit" id="loginBtn"><span>Enter the studio</span><svg class="i"><use href="#i-right"/></svg></button>
    <p class="login-foot"><svg class="i"><use href="#i-lock"/></svg>Private &amp; encrypted. Your login lives in Cloudflare.</p>
  </form>
  <div class="setup" id="setup" hidden></div>
</section>

<!-- Studio -->
<div class="studio" id="studio" hidden>
  <header class="bar">
    <div class="bar-l">
      <img src="https://res.cloudinary.com/dhn6pvsr1/image/upload/f_auto,q_auto,c_limit,w_120/v1790515212/splash-favicon-logo_yxkwes.png" alt="" width="40" height="40">
      <div class="brand-t"><b>Studio</b><span>Dr. Navjot Kaur</span></div>
    </div>
    <div class="bar-c">
      <div class="seg" id="devices" role="group" aria-label="Preview size">
        <span class="seg-pill" aria-hidden="true"></span>
        <button type="button" data-device="desktop" aria-pressed="true" title="Desktop"><svg class="i"><use href="#i-monitor"/></svg><span>Desktop</span></button>
        <button type="button" data-device="tablet" aria-pressed="false" title="Tablet"><svg class="i"><use href="#i-tablet"/></svg><span>Tablet</span></button>
        <button type="button" data-device="phone" aria-pressed="false" title="Phone"><svg class="i"><use href="#i-phone"/></svg><span>Phone</span></button>
      </div>
    </div>
    <div class="bar-r">
      <button class="status" id="status" type="button" title="Publishing status"><i></i><span>Loading…</span></button>
      <button class="ic-btn" id="undoBtn" type="button" title="Undo (Ctrl+Z)" disabled><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="ic-btn" id="redoBtn" type="button" title="Redo (Ctrl+Shift+Z)" disabled><svg class="i"><use href="#i-redo"/></svg></button>
      <button class="ic-btn" id="historyBtn" type="button" title="Version history"><svg class="i"><use href="#i-clock"/></svg></button>
      <a class="ic-btn" href="/" target="_blank" rel="noopener" title="Open the live website"><svg class="i"><use href="#i-ext"/></svg></a>
      <button class="gold-btn" id="publishBtn" type="button" disabled><svg class="i"><use href="#i-send"/></svg><span>Publish</span><em class="count" id="changeCount" hidden>0</em></button>
    </div>
  </header>

  <aside class="side">
    <nav class="rail" id="rail" aria-label="Studio panels">
      <button type="button" data-panel="overview" title="Overview"><svg class="i"><use href="#i-home"/></svg><span>Home</span></button>
      <button type="button" data-panel="sections" title="Sections"><svg class="i"><use href="#i-layers"/></svg><span>Sections</span></button>
      <button type="button" data-panel="photos" title="Photos & videos"><svg class="i"><use href="#i-image"/></svg><span>Photos</span></button>
      <button type="button" data-panel="podcasts" title="Podcasts"><svg class="i"><use href="#i-mic"/></svg><span>Podcasts</span></button>
      <button type="button" data-panel="links" title="Contact & links"><svg class="i"><use href="#i-link"/></svg><span>Contact</span></button>
      <button type="button" data-panel="seo" title="Google & sharing"><svg class="i"><use href="#i-globe"/></svg><span>Google</span></button>
      <button type="button" data-panel="health" title="Site health"><svg class="i"><use href="#i-heart"/></svg><span>Health</span></button>
      <span class="rail-sp"></span>
      <button type="button" id="paletteBtn" title="Search everything (Ctrl+K)"><svg class="i"><use href="#i-search"/></svg><span>Search</span></button>
      <button type="button" id="logoutBtn" title="Sign out"><svg class="i"><use href="#i-logout"/></svg><span>Sign out</span></button>
    </nav>
    <div class="panel" id="panel"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="banner" id="banner" hidden></div>
    <div class="canvas" id="canvas">
      <div class="device" id="device" data-device="desktop">
        <div class="device-load" id="frameLoad"><span></span></div>
        <iframe id="frame" title="Live preview of your website"></iframe>
      </div>
    </div>
    <div class="hover-box" id="hoverBox" hidden><span class="hb-chip"></span></div>
    <div class="toolbar" id="toolbar" hidden>
      <span class="tb-label" id="tbLabel"></span>
      <button type="button" data-cmd="bold" title="Bold"><svg class="i"><use href="#i-bold"/></svg></button>
      <button type="button" data-cmd="italic" title="Gold italic"><svg class="i"><use href="#i-italic"/></svg></button>
      <button type="button" data-cmd="br" title="New line"><svg class="i"><use href="#i-return"/></svg></button>
      <button type="button" data-cmd="clear" title="Remove formatting"><svg class="i"><use href="#i-eraser"/></svg></button>
      <button type="button" data-cmd="link" title="Change link" hidden><svg class="i"><use href="#i-link"/></svg></button>
      <button type="button" data-cmd="reset" title="Back to the original text"><svg class="i"><use href="#i-rotate"/></svg></button>
      <button type="button" data-cmd="done" class="tb-done"><svg class="i"><use href="#i-check"/></svg>Done</button>
    </div>
    <p class="stage-hint" id="stageHint"><svg class="i"><use href="#i-sparkles"/></svg>Click any text to edit it · click any photo to change it</p>
  </main>
</div>

<div class="layer" id="layer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
</body>
</html>
